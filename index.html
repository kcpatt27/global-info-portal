    <!-- Prevent phone number detection on iOS -->
    <meta name="format-detection" content="telephone=no">
    <!-- Disable automatic text size adjustment on iOS -->
    <meta name="text-size-adjust" content="100%">
    <!-- Ensure proper rendering and touch zooming -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

        .container{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:100vh;width:100%;height:100vh;overflow:hidden}
        .info-container{background-color:#1c1c1c;padding:20px;overflow-y:auto;position:relative;z-index:20;display:flex;flex-direction:column;box-shadow:-5px 0 15px rgba(0,0,0,0.2)}
        .map-container{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;background-color:#000}
        .country{fill:#90ee90;stroke:#000;cursor:pointer}
        .ocean{fill:rgb(117,114,111)}
        @media (max-width:768px){
          .container{grid-template-columns:1fr;grid-template-rows:minmax(0,60vh) minmax(0,40vh);height:100%;overflow:auto}
          .info-container{padding:15px;width:100%;position:relative;bottom:0;box-shadow:0 -5px 15px rgba(0,0,0,0.2);max-height:40vh}
        }

    <!-- Mobile layout expansion script -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check if we're on a mobile device
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      
      if (isMobile) {
        // Initialize info container interactions
        const infoContainer = document.querySelector('.info-container');
        const mapContainer = document.querySelector('.map-container');
        const navSidebar = document.querySelector('.nav-sidebar');
        const mobileNavContainer = document.querySelector('.mobile-nav-container');
        
        // Function to handle sidebar collapse
        window.collapseSidebar = function() {
          infoContainer.classList.add('collapsed');
          navSidebar.classList.add('visible');
          
          // Show mobile navigation when sidebar is collapsed
          if (mobileNavContainer) {
            mobileNavContainer.classList.remove('hidden');
          }
          
          // Show the map fully when sidebar is collapsed
          if (mapContainer) {
            mapContainer.classList.add('expanded');
          }
        };
        
        // Function to handle sidebar expansion
        window.expandSidebar = function() {
          infoContainer.classList.remove('collapsed');
          navSidebar.classList.remove('visible');
          
          // Hide mobile navigation when sidebar is expanded
          if (mobileNavContainer) {
            mobileNavContainer.classList.add('hidden');
          }
          
          // Contract the map when sidebar is shown
          if (mapContainer) {
            mapContainer.classList.remove('expanded');
          }
        };
        
        // Set up initial state - sidebar is visible initially on mobile
        if (infoContainer) {
          // Ensure sidebar is visible initially 
          infoContainer.classList.remove('collapsed');
          navSidebar.classList.remove('visible');
          
          // Hide mobile navigation initially when sidebar is expanded
          if (mobileNavContainer) {
            mobileNavContainer.classList.add('hidden');
          }
          
          // Add swipe-down gesture to close panel
          let touchStartY = 0;
          let touchEndY = 0;
          const SWIPE_THRESHOLD = 50; // Minimum distance for swipe
          
          infoContainer.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
          }, { passive: true });
          
          infoContainer.addEventListener('touchmove', (e) => {
            touchEndY = e.touches[0].clientY;
            
            // Calculate distance
            const swipeDistance = touchEndY - touchStartY;
            
            // If swiping down
            if (swipeDistance > 10) {
              // Add visual feedback during swipe
              infoContainer.classList.add('swiping');
              
              // Add slight move to the panel based on swipe distance (max 30px)
              const moveDistance = Math.min(swipeDistance * 0.3, 30);
              infoContainer.style.transform = `translateY(${moveDistance}px)`;
              
              // Removed preventDefault to avoid interfering with map gestures
              // const scrollTop = e.target.closest('.content-panel')?.scrollTop || 0;
              // if (scrollTop <= 0) {
              //   e.preventDefault(); 
              // }
            }
          }, { passive: true });
          
          infoContainer.addEventListener('touchend', (e) => {
            const swipeDistance = touchEndY - touchStartY;
            
            // Remove visual feedback
            infoContainer.classList.remove('swiping');
            
            // Reset transform
            infoContainer.style.transform = '';
            
            // If swipe down distance is greater than threshold
            if (swipeDistance > SWIPE_THRESHOLD) {
              window.collapseSidebar();
            }
            
            // Reset values
            touchStartY = 0;
            touchEndY = 0;
          });
          
          // Pointer-based drag to expand/collapse (mouse/pen parity)
          let pointerStartY = 0;
          let isPointerDragging = false;
          infoContainer.addEventListener('pointerdown', (e) => {
            // Only act on primary button
            if (e.button !== undefined && e.button !== 0) return;
            const isTopArea = e.target === infoContainer ||
                              e.target.closest('.info-header') ||
                              e.clientY < (infoContainer.getBoundingClientRect().top + 40);
            if (!isTopArea) return;
            isPointerDragging = true;
            pointerStartY = e.clientY;
            infoContainer.style.transition = 'none';
            infoContainer.setPointerCapture && infoContainer.setPointerCapture(e.pointerId);
          });
          infoContainer.addEventListener('pointermove', (e) => {
            if (!isPointerDragging) return;
            const diffY = pointerStartY - e.clientY; // positive when dragging up
            // Visual feedback
            const maxMove = window.innerHeight * 0.4;
            const translate = Math.max(-maxMove, Math.min(0, -diffY * 0.3));
            infoContainer.style.transform = `translateY(${translate}px)`;
            infoContainer.classList.add('swiping');
            // Snap when threshold exceeded
            if (diffY > 50 && !infoContainer.classList.contains('expanded')) {
              infoContainer.classList.remove('swiping');
              infoContainer.style.transform = '';
              infoContainer.classList.add('expanded');
              infoContainer.style.transition = '';
              isPointerDragging = false;
            } else if (diffY < -50 && infoContainer.classList.contains('expanded')) {
              infoContainer.classList.remove('swiping');
              infoContainer.style.transform = '';
              infoContainer.classList.remove('expanded');
              infoContainer.style.transition = '';
              isPointerDragging = false;
            }
          });
          const endPointerDrag = () => {
            if (!isPointerDragging) return;
            infoContainer.classList.remove('swiping');
            infoContainer.style.transform = '';
            infoContainer.style.transition = '';
            isPointerDragging = false;
          };
          infoContainer.addEventListener('pointerup', endPointerDrag);
          infoContainer.addEventListener('pointercancel', endPointerDrag);
          
          // Also remove swiping class when touch is canceled
          infoContainer.addEventListener('touchcancel', () => {
            infoContainer.classList.remove('swiping');
            infoContainer.style.transform = '';
            touchStartY = 0;
            touchEndY = 0;
          });
          
          // Close button event - explicitly binding the collapseSidebar function
          const closeButton = document.getElementById('close-sidebar');
          if (closeButton) {
            closeButton.addEventListener('click', function(e) {
              e.preventDefault();
              window.collapseSidebar();
            });
          }
          
          // Open button event
          const openButton = document.getElementById('open-sidebar');
          if (openButton) {
            openButton.addEventListener('click', function(e) {
              e.preventDefault();
              window.expandSidebar();
            });
          }
          
          // Handle mobile nav item clicks
          document.querySelectorAll('.mobile-nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
              e.preventDefault();
              
              // Get the nav ID
              const navId = item.getAttribute('data-nav-id');
              
              // Set active nav item
              document.querySelectorAll('.mobile-nav-item').forEach(navItem => {
                navItem.classList.remove('active');
              });
              item.classList.add('active');
              
              // Handle navigation action
              if (navId === 'map') {
                window.collapseSidebar();
              } else if (navId === 'info' || navId === 'data') {
                window.expandSidebar();
                
                // Switch to correct panel
                document.querySelectorAll('.sidebar-button').forEach(btn => {
                  btn.classList.remove('active');
                });
                document.querySelectorAll('.content-panel').forEach(panel => {
                  panel.classList.remove('active');
                });
                
                const panelId = navId + '-panel';
                document.querySelector(`.sidebar-button[data-panel="${navId}"]`).classList.add('active');
                document.getElementById(panelId).classList.add('active');
              }
            });
          });
          
          // Set the first nav item as active by default
          const firstNavItem = document.querySelector('.mobile-nav-item');
          if (firstNavItem) {
            firstNavItem.classList.add('active');
          }
          
          // Handle hamburger menu
          const hamburgerToggle = document.querySelector('.hamburger-menu-toggle');
          const hamburgerPanel = document.querySelector('.hamburger-menu-panel');
          const hamburgerOverlay = document.querySelector('.hamburger-menu-overlay');
          
          if (hamburgerToggle && hamburgerPanel && hamburgerOverlay) {
            // Toggle menu on hamburger click
            hamburgerToggle.addEventListener('click', () => {
              hamburgerToggle.classList.toggle('active');
              hamburgerPanel.classList.toggle('active');
              hamburgerOverlay.classList.toggle('active');
            });
            
            // Close menu on overlay click
            hamburgerOverlay.addEventListener('click', () => {
              hamburgerToggle.classList.remove('active');
              hamburgerPanel.classList.remove('active');
              hamburgerOverlay.classList.remove('active');
            });
            
            // Handle menu item clicks
            document.querySelectorAll('.hamburger-menu-link').forEach(link => {
              link.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Close the menu
                hamburgerToggle.classList.remove('active');
                hamburgerPanel.classList.remove('active');
                hamburgerOverlay.classList.remove('active');
                
                // Handle navigation based on menu-id
                const menuId = link.getAttribute('data-menu-id');
                
                // Find and trigger the corresponding mobile nav item if it exists
                const navItem = document.querySelector(`.mobile-nav-item[data-nav-id="${menuId}"]`);
                if (navItem) {
                  navItem.click();
                }
              });
            });
          }
          
          // Add device-specific class detection
          // Check for iOS devices
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            document.body.classList.add('ios-device');
          }
          
          // Check for home indicator (iPhone X and newer)
          if (isIOS && window.screen.height >= 812) {
            document.body.classList.add('has-home-indicator');
          }
          
          // Check for Android devices
          const isAndroid = /Android/.test(navigator.userAgent);
          if (isAndroid) {
            document.body.classList.add('android-device');
          }
          
          // Handle Settings Panel Toggle
          const settingsToggleButton = document.getElementById('toggle-settings');
          const settingsPanel = document.getElementById('settings-panel');
          const closePanelButton = document.querySelector('#settings-panel .close-panel-button');
          let lastActivePanel = null;
          
          if (settingsToggleButton && settingsPanel) {
            // Open settings when the settings button is clicked
            settingsToggleButton.addEventListener('click', function(e) {
              e.preventDefault();
              
              // Expand the sidebar if it's collapsed
              if (infoContainer.classList.contains('collapsed')) {
                window.expandSidebar();
              }
              
              // Store the currently active panel
              lastActivePanel = document.querySelector('.content-panel.active');
              
              // Hide all content panels
              document.querySelectorAll('.content-panel').forEach(panel => {
                panel.classList.remove('active');
              });
              
              // Show settings panel
              settingsPanel.classList.add('active');
              
              // Update sidebar buttons visual state (unselect all)
              document.querySelectorAll('.sidebar-button').forEach(btn => {
                btn.classList.remove('active');
              });
            });
            
            // Close settings when the close button is clicked
            if (closePanelButton) {
              closePanelButton.addEventListener('click', function() {
                // Hide settings panel
                settingsPanel.classList.remove('active');
                
                // Restore the last active panel or default to info panel
                if (lastActivePanel) {
                  lastActivePanel.classList.add('active');
                  
                  // Update sidebar button state to match
                  const panelId = lastActivePanel.id;
                  const panelType = panelId.replace('-panel', '');
                  const sidebarButton = document.querySelector(`.sidebar-button[data-panel="${panelType}"]`);
                  if (sidebarButton) {
                    sidebarButton.classList.add('active');
                  }
                } else {
                  // Default to info panel
                  document.getElementById('info-panel').classList.add('active');
                  document.querySelector('.sidebar-button[data-panel="info"]').classList.add('active');
                }
              });
            }
          }
          
          // Make the mobile nav settings button also open the settings panel
          const mobileSettingsButton = document.querySelector('.mobile-nav-item[data-nav-id="settings"]');
          if (mobileSettingsButton && settingsPanel) {
            mobileSettingsButton.addEventListener('click', function(e) {
              e.preventDefault();
              
              // Set active nav item
              document.querySelectorAll('.mobile-nav-item').forEach(navItem => {
                navItem.classList.remove('active');
              });
              mobileSettingsButton.classList.add('active');
              
              // Expand sidebar if collapsed
              window.expandSidebar();
              
              // Store the currently active panel
              lastActivePanel = document.querySelector('.content-panel.active');
              
              // Hide all content panels
              document.querySelectorAll('.content-panel').forEach(panel => {
                panel.classList.remove('active');
              });
              
              // Show settings panel
              settingsPanel.classList.add('active');
              
              // Update sidebar buttons visual state (unselect all)
              document.querySelectorAll('.sidebar-button').forEach(btn => {
                btn.classList.remove('active');
              });
            });
          }
        }
      }
    });
    </script>
