    <!-- Enhanced viewport configuration for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover">
    <!-- Prevent phone number detection on iOS -->
    <meta name="format-detection" content="telephone=no">
    <!-- Disable automatic text size adjustment on iOS -->
    <meta name="text-size-adjust" content="100%">
    <!-- Ensure proper rendering and touch zooming -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Mobile web app capable -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Status bar style for iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

        /* Critical CSS inlined */
        *{margin:0;padding:0;box-sizing:border-box}
        body,html{height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background-color:#121212;color:#e0e0e0}
        .container{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:100vh;width:100%;height:100vh;overflow:hidden}
        .info-container{background-color:#1c1c1c;padding:20px;overflow-y:auto;position:relative;z-index:20;display:flex;flex-direction:column;box-shadow:-5px 0 15px rgba(0,0,0,0.2)}
        .map-container{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;background-color:#000}
        .country{fill:#90ee90;stroke:#000;cursor:pointer}
        .ocean{fill:rgb(117,114,111)}
        @media (max-width:768px){
          .container{grid-template-columns:1fr;grid-template-rows:minmax(0,60vh) minmax(0,40vh);height:100%;overflow:auto}
          .info-container{padding:15px;width:100%;position:relative;bottom:0;box-shadow:0 -5px 15px rgba(0,0,0,0.2);max-height:40vh}
        }

    <!-- Touch protection area for devices with home indicators -->
    <div class="touch-protection-area"></div>
    
    <!-- External libraries -->
    <script src="https://unpkg.com/d3@5.6.0/dist/d3.min.js"></script>

    <!-- Mobile layout expansion script -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check if we're on a mobile device
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      
      if (isMobile) {
        // Initialize info container interactions
        const infoContainer = document.querySelector('.info-container');
        const mapContainer = document.querySelector('.map-container');
        const navSidebar = document.querySelector('.nav-sidebar');
        
        // Function to update nav bar visibility based on panel state
        function updateNavBarVisibility() {
          const isCollapsed = infoContainer.classList.contains('collapsed');
          const isExpanded = infoContainer.classList.contains('expanded');
          const isVisible = !isCollapsed; // Panel is visible when not collapsed
          
          // Nav bar should show when info panel is NOT visible (collapsed)
          // Nav bar should hide when info panel IS visible (expanded or normal)
          if (isVisible) {
            // Panel is visible - hide nav bar
            navSidebar.classList.remove('visible');
          } else {
            // Panel is collapsed/not visible - show nav bar
            navSidebar.classList.add('visible');
          }
        }
        
        // Function to handle sidebar collapse - but keep header visible
        window.collapseSidebar = function() {
          infoContainer.classList.add('collapsed');
          infoContainer.classList.remove('expanded');
          // Set explicit height to show only header (flag + country name)
          infoContainer.style.height = '100px';
          
          // Show the map fully when sidebar is collapsed
          if (mapContainer) {
            mapContainer.classList.add('expanded');
          }
          
          // Update nav bar visibility
          updateNavBarVisibility();
        };
        
        // Function to handle sidebar expansion
        window.expandSidebar = function() {
          infoContainer.classList.remove('collapsed');
          // Reset height to default
          infoContainer.style.height = '';
          
          // Contract the map when sidebar is shown
          if (mapContainer) {
            mapContainer.classList.remove('expanded');
          }
          
          // Update nav bar visibility
          updateNavBarVisibility();
        };
        
        // Set up initial state - sidebar is visible initially on mobile
        if (infoContainer) {
          // Mark as set up to prevent duplicate handlers from mobile-interactions.js
          infoContainer.setAttribute('data-drag-setup', 'true');
          
          // Ensure sidebar is visible initially 
          infoContainer.classList.remove('collapsed');
          navSidebar.classList.remove('visible');
          
          // Initial nav bar visibility update
          updateNavBarVisibility();
          
          // Panel drag gesture - smooth continuous movement with snap on release
          let touchStartY = 0;
          let touchCurrentY = 0;
          let panelStartHeight = 0;
          let isDragging = false;
          let lastVelocity = 0;
          let lastTouchTime = 0;
          let lastTouchY = 0;
          
          // Height constants
          const MIN_HEIGHT = 100; // Collapsed - just header
          const DEFAULT_HEIGHT = window.innerHeight * 0.4; // Default 40vh
          const MAX_HEIGHT = window.innerHeight - 20; // Full screen (with small margin)
          
          // Get the pull handle area (top 50px of panel)
          const isPullArea = (touchY) => {
            const rect = infoContainer.getBoundingClientRect();
            return touchY < rect.top + 50;
          };
          
          infoContainer.addEventListener('touchstart', (e) => {
            const touchY = e.touches[0].clientY;
            
            // Check if touching the pull handle area at top of panel
            if (!isPullArea(touchY)) {
              // Not in pull area - check if scrolled content
              const activePanel = infoContainer.querySelector('.content-panel.active');
              const scrollContainer = activePanel?.querySelector('.background-info, .data-panel');
              if (scrollContainer && scrollContainer.scrollTop > 0) {
                return; // Let the content scroll
              }
            }
            
            touchStartY = touchY;
            touchCurrentY = touchY;
            panelStartHeight = infoContainer.offsetHeight;
            isDragging = true;
            lastTouchTime = Date.now();
            lastTouchY = touchY;
            lastVelocity = 0;
            
            // Disable transitions during drag for responsive feel
            infoContainer.style.transition = 'none';
            infoContainer.classList.add('dragging');
          }, { passive: true });
          
          infoContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const touchY = e.touches[0].clientY;
            const now = Date.now();
            const dt = now - lastTouchTime;
            
            // Calculate velocity for momentum
            if (dt > 0) {
              lastVelocity = (touchY - lastTouchY) / dt;
            }
            lastTouchTime = now;
            lastTouchY = touchY;
            touchCurrentY = touchY;
            
            // Calculate new height based on drag direction
            // Moving finger down = smaller panel, finger up = larger panel
            const dragDistance = touchStartY - touchY;
            let newHeight = panelStartHeight + dragDistance;
            
            // Clamp height between min and max
            newHeight = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, newHeight));
            
            // Apply the height directly for smooth 1:1 tracking
            infoContainer.style.height = `${newHeight}px`;
            
            // Visual feedback
            infoContainer.classList.add('swiping');
          }, { passive: true });
          
          infoContainer.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            
            isDragging = false;
            infoContainer.classList.remove('dragging');
            infoContainer.classList.remove('swiping');
            
            // Get current height
            const currentHeight = infoContainer.offsetHeight;
            
            // Calculate momentum-based target (velocity * time constant)
            const momentumOffset = lastVelocity * 150; // 150ms momentum
            const projectedHeight = currentHeight - momentumOffset;
            
            // Determine snap target based on position and velocity
            let targetHeight;
            let targetClass = '';
            
            // Define snap thresholds
            const collapseThreshold = MIN_HEIGHT + (DEFAULT_HEIGHT - MIN_HEIGHT) * 0.4;
            const expandThreshold = DEFAULT_HEIGHT + (MAX_HEIGHT - DEFAULT_HEIGHT) * 0.4;
            
            if (projectedHeight <= collapseThreshold) {
              // Snap to collapsed (minimum)
              targetHeight = MIN_HEIGHT;
              targetClass = 'collapsed';
            } else if (projectedHeight >= expandThreshold) {
              // Snap to expanded (full screen)
              targetHeight = MAX_HEIGHT;
              targetClass = 'expanded';
            } else {
              // Snap to default height
              targetHeight = DEFAULT_HEIGHT;
              targetClass = '';
            }
            
            // Enable smooth transition for snap animation
            infoContainer.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            infoContainer.style.height = `${targetHeight}px`;
            
            // Update classes
            infoContainer.classList.remove('collapsed', 'expanded');
            if (targetClass) {
              infoContainer.classList.add(targetClass);
            }
            
            // Update nav bar visibility
            updateNavBarVisibility();
            
            // Reset after transition
            setTimeout(() => {
              infoContainer.style.transition = '';
            }, 300);
          });
          
          // Handle touch cancel
          infoContainer.addEventListener('touchcancel', () => {
            if (!isDragging) return;
            isDragging = false;
            infoContainer.classList.remove('dragging', 'swiping');
            infoContainer.style.transition = '';
          });
          
          // Pointer-based drag (for mouse/pen in desktop/IDE preview)
          // Uses same height-based system as touch for consistency
          let ptrStartY = 0;
          let ptrCurrentY = 0;
          let ptrPanelStartHeight = 0;
          let isPtrDragging = false;
          let ptrLastVelocity = 0;
          let ptrLastTime = 0;
          let ptrLastY = 0;
          
          infoContainer.addEventListener('pointerdown', (e) => {
            // Only for mouse/pen, not touch (touch is handled separately)
            if (e.pointerType === 'touch') return;
            
            // Only act on primary button
            if (e.button !== 0) return;
            
            const clientY = e.clientY;
            const rect = infoContainer.getBoundingClientRect();
            
            // Check if in pull area (top 50px)
            if (clientY >= rect.top + 50) {
              const activePanel = infoContainer.querySelector('.content-panel.active');
              const scrollContainer = activePanel?.querySelector('.background-info, .data-panel');
              if (scrollContainer && scrollContainer.scrollTop > 0) {
                return;
              }
            }
            
            ptrStartY = clientY;
            ptrCurrentY = clientY;
            ptrPanelStartHeight = infoContainer.offsetHeight;
            isPtrDragging = true;
            ptrLastTime = Date.now();
            ptrLastY = clientY;
            ptrLastVelocity = 0;
            
            infoContainer.style.transition = 'none';
            infoContainer.classList.add('dragging');
            infoContainer.setPointerCapture?.(e.pointerId);
            e.preventDefault();
          });
          
          infoContainer.addEventListener('pointermove', (e) => {
            if (!isPtrDragging || e.pointerType === 'touch') return;
            
            const clientY = e.clientY;
            const now = Date.now();
            const dt = now - ptrLastTime;
            
            if (dt > 0) {
              ptrLastVelocity = (clientY - ptrLastY) / dt;
            }
            ptrLastTime = now;
            ptrLastY = clientY;
            ptrCurrentY = clientY;
            
            // Calculate new height
            const dragDistance = ptrStartY - clientY;
            let newHeight = ptrPanelStartHeight + dragDistance;
            newHeight = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, newHeight));
            
            infoContainer.style.height = `${newHeight}px`;
            infoContainer.classList.add('swiping');
            e.preventDefault();
          });
          
          const endPtrDrag = (e) => {
            if (!isPtrDragging) return;
            if (e && e.pointerType === 'touch') return;
            
            isPtrDragging = false;
            infoContainer.classList.remove('dragging', 'swiping');
            
            const currentHeight = infoContainer.offsetHeight;
            const momentumOffset = ptrLastVelocity * 150;
            const projectedHeight = currentHeight - momentumOffset;
            
            const collapseThreshold = MIN_HEIGHT + (DEFAULT_HEIGHT - MIN_HEIGHT) * 0.4;
            const expandThreshold = DEFAULT_HEIGHT + (MAX_HEIGHT - DEFAULT_HEIGHT) * 0.4;
            
            let targetHeight;
            let targetClass = '';
            
            if (projectedHeight <= collapseThreshold) {
              targetHeight = MIN_HEIGHT;
              targetClass = 'collapsed';
            } else if (projectedHeight >= expandThreshold) {
              targetHeight = MAX_HEIGHT;
              targetClass = 'expanded';
            } else {
              targetHeight = DEFAULT_HEIGHT;
              targetClass = '';
            }
            
            infoContainer.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            infoContainer.style.height = `${targetHeight}px`;
            
            infoContainer.classList.remove('collapsed', 'expanded');
            if (targetClass) {
              infoContainer.classList.add(targetClass);
            }
            
            updateNavBarVisibility();
            
            setTimeout(() => {
              infoContainer.style.transition = '';
            }, 300);
          };
          
          infoContainer.addEventListener('pointerup', endPtrDrag);
          infoContainer.addEventListener('pointercancel', endPtrDrag);
          
          // Close button event - explicitly binding the collapseSidebar function
          const closeButton = document.getElementById('close-sidebar');
          if (closeButton) {
            closeButton.addEventListener('click', function(e) {
              e.preventDefault();
              window.collapseSidebar();
            });
          }
          
          // Open button event
          const openButton = document.getElementById('open-sidebar');
          if (openButton) {
            openButton.addEventListener('click', function(e) {
              e.preventDefault();
              window.expandSidebar();
            });
          }
          
          // Handle hamburger menu
          const hamburgerToggle = document.querySelector('.hamburger-menu-toggle');
          const hamburgerPanel = document.querySelector('.hamburger-menu-panel');
          const hamburgerOverlay = document.querySelector('.hamburger-menu-overlay');
          
          if (hamburgerToggle && hamburgerPanel && hamburgerOverlay) {
            // Toggle menu on hamburger click
            hamburgerToggle.addEventListener('click', () => {
              hamburgerToggle.classList.toggle('active');
              hamburgerPanel.classList.toggle('active');
              hamburgerOverlay.classList.toggle('active');
            });
            
            // Close menu on overlay click
            hamburgerOverlay.addEventListener('click', () => {
              hamburgerToggle.classList.remove('active');
              hamburgerPanel.classList.remove('active');
              hamburgerOverlay.classList.remove('active');
            });
            
            // Handle menu item clicks
            document.querySelectorAll('.hamburger-menu-link').forEach(link => {
              link.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Close the menu
                hamburgerToggle.classList.remove('active');
                hamburgerPanel.classList.remove('active');
                hamburgerOverlay.classList.remove('active');
                
                // Handle navigation based on menu-id
                const menuId = link.getAttribute('data-menu-id');
                
                // Mobile nav removed - handle menu clicks directly if needed
              });
            });
          }
          
          // Add device-specific class detection
          // Check for iOS devices
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            document.body.classList.add('ios-device');
          }
          
          // Check for home indicator (iPhone X and newer)
          if (isIOS && window.screen.height >= 812) {
            document.body.classList.add('has-home-indicator');
          }
          
          // Check for Android devices
          const isAndroid = /Android/.test(navigator.userAgent);
          if (isAndroid) {
            document.body.classList.add('android-device');
          }
          
          // Handle Settings Panel (removed from navbar, but keep panel functionality)
          const settingsPanel = document.getElementById('settings-panel');
          const closePanelButton = document.querySelector('#settings-panel .close-panel-button');
          let lastActivePanel = null;
          
          // Close settings when the close button is clicked
          if (closePanelButton && settingsPanel) {
            closePanelButton.addEventListener('click', function() {
              // Hide settings panel
              settingsPanel.classList.remove('active');
              
              // Restore the last active panel or default to info panel
              if (lastActivePanel) {
                lastActivePanel.classList.add('active');
                
                // Update sidebar button state to match
                const panelId = lastActivePanel.id;
                const panelType = panelId.replace('-panel', '');
                const sidebarButton = document.querySelector(`.sidebar-button[data-panel="${panelType}"]`);
                if (sidebarButton) {
                  sidebarButton.classList.add('active');
                }
              } else {
                // Default to info panel
                document.getElementById('info-panel').classList.add('active');
                document.querySelector('.sidebar-button[data-panel="info"]').classList.add('active');
              }
            });
          }
          
        }
      }
    });
    </script>
