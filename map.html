<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global Information Portal</title>
    <style>
        /* Base reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        /* Responsive grid container */
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 100vh;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 50vh 50vh;
            }
        }
        /* Map container */
        .map-container {
            position: relative;
            overflow: hidden;
        }
        .map-container svg {
            width: 100%;
            height: 100%;
        }
        /* Info sidebar styling */
        .info-container {
            background-color: #1c1c1c;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 20;
        }
        .info-container.collapsed {
            transform: translateX(100%);
            opacity: 0;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .flag {
            width: 50px;
            height: 50px;
            background-color: #fff;
            margin-right: 10px;
        }
        .country-info {
            font-weight: bold;
            font-size: 1.2em;
        }
        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.5em;
            color: #e0e0e0;
            cursor: pointer;
        }
        /* Chart Tabs styling */
        .chart-tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        .chart-tab {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .chart-tab.active {
            background-color: #444;
            font-weight: bold;
        }
        .charts .chart {
            display: none;
            padding: 10px;
            transition: opacity 0.3s ease;
        }
        .charts .chart.active {
            display: block;
            opacity: 1;
        }
        /* Country shape styling */
        .country {
            fill: lightgreen;
            stroke: #333;
            stroke-width: 0.32px;
            cursor: pointer;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }
        .country:hover {
            fill: red;
        }
        .country.selected {
            fill: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="map-container">
            <svg width="960" height="500" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="info-container">
            <div class="info-header">
                <div class="flag">FLAG</div>
                <div class="country-info">COUNTRY INFO</div>
                <button class="close-sidebar" id="close-sidebar" aria-label="Close Sidebar">×</button>
            </div>
            <div class="background-info">INTRODUCTION / BACKGROUND</div>
            <div class="charts">
                <div class="chart-tabs">
                    <div class="chart-tab active" data-tab="0">GDP</div>
                    <div class="chart-tab" data-tab="1">Revenue</div>
                    <div class="chart-tab" data-tab="2">Population</div>
                    <div class="chart-tab" data-tab="3">Other</div>
                </div>
                <div class="chart active" data-chart="0">GDP Chart</div>
                <div class="chart" data-chart="1">Revenue Chart</div>
                <div class="chart" data-chart="2">Population Chart</div>
                <div class="chart" data-chart="3">Other Chart</div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/d3@5.6.0/dist/d3.min.js"></script>
    <script src="https://unpkg.com/topojson@3.0.2/dist/topojson.min.js"></script>
    <script>
        const svg = d3.select("svg");
        const width = 960;
        const height = 500;

        // Open the sidebar if it's collapsed.
        function openSidebar() {
            document.querySelector(".info-container").classList.remove("collapsed");
        }

        // Clear any selected country, reset the info panel, and show the sidebar.
        function clearSelection() {
            svg.selectAll("path.country")
                .classed("selected", false)
                .transition()
                .duration(300)
                .style("fill", "lightgreen");
            document.querySelector(".country-info").textContent = "COUNTRY INFO";
            document.querySelector(".background-info").textContent = "INTRODUCTION / BACKGROUND";
            openSidebar();
        }

        // Initialize chart tabs event handling.
        function initChartTabs() {
            const tabs = document.querySelectorAll(".chart-tab");
            const charts = document.querySelectorAll(".charts .chart");
            tabs.forEach(tab => {
                tab.addEventListener("click", function() {
                    tabs.forEach(t => t.classList.remove("active"));
                    charts.forEach(chart => chart.classList.remove("active"));
                    this.classList.add("active");
                    const tabIndex = this.getAttribute("data-tab");
                    document.querySelector(`.charts .chart[data-chart="${tabIndex}"]`).classList.add("active");
                });
            });
        }

        // Sidebar toggle.
        document.getElementById("close-sidebar").addEventListener("click", () => {
            document.querySelector(".info-container").classList.toggle("collapsed");
        });

        // Load and render map data.
        async function loadMapData() {
            const jsonURL = "https://raw.githubusercontent.com/kcpatt27/world-atlas-2-world-factbook/main/world%20atlas%20json%2050m";
            const tsvURL = "https://raw.githubusercontent.com/kcpatt27/world-atlas-2-world-factbook/main/world%20atlas%20tsv_rows.tsv";
            try {
                const topoJSONdata = await d3.json(jsonURL);
                const tsvData = await d3.tsv(tsvURL);
                const countryInfo = tsvData.reduce((acc, d) => {
                    acc[d.iso_n3] = {
                        name: d.name,
                        continent: d.continent,
                        a2Code: d.iso_a2
                    };
                    return acc;
                }, {});
                
                // Create a group for map elements (to enable zoom/pan).
                const g = svg.append("g");
                const projection = d3.geoNaturalEarth1()
                    .scale(width / 6)
                    .translate([width / 2, height / 2]);
                const pathGenerator = d3.geoPath().projection(projection);
                
                // Draw the globe (sphere) background.
                g.append("path")
                    .attr("class", "sphere")
                    .attr("d", pathGenerator({ type: "Sphere" }));
                
                // Convert TopoJSON to GeoJSON.
                const countries = topojson.feature(topoJSONdata, topoJSONdata.objects.countries).features;
                
                // Render country shapes with transitions and events.
                g.selectAll("path.country")
                    .data(countries)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", pathGenerator)
                    .style("fill", "lightgreen")
                    .on("mouseover", function(d) {
                        if (!d3.select(this).classed("selected")) {
                            d3.select(this).transition().duration(300).style("fill", "red");
                        }
                    })
                    .on("mouseout", function(d) {
                        if (!d3.select(this).classed("selected")) {
                            d3.select(this).transition().duration(300).style("fill", "lightgreen");
                        }
                    })
                    .on("click", function(d) {
                        d3.event.stopPropagation();
                        const isSelected = d3.select(this).classed("selected");
                        if (isSelected) {
                            clearSelection();
                        } else {
                            clearSelection();
                            d3.select(this)
                                .classed("selected", true)
                                .transition()
                                .duration(300)
                                .style("fill", "red");
                            // Ensure the sidebar is visible when a country is selected.
                            openSidebar();
                            const info = countryInfo[d.id];
                            if (info) {
                                document.querySelector(".country-info").textContent =
                                    info.name + " (" + info.a2Code + ") - " + info.continent;
                                document.querySelector(".background-info").textContent =
                                    "Loading information about " + info.name + "...";
                                
                                // Try to load additional data with error handling
                                try {
                                    const formattedContinent = info.continent.replace(/\s+/g, '-').toLowerCase();
                                    const lowercaseA2Code = info.a2Code.toLowerCase();
                                    const url = `https://raw.githubusercontent.com/factbook/factbook.json/master/${formattedContinent}/${lowercaseA2Code}.json`;
                                    
                                    // Add a timeout to the fetch to prevent long hangs
                                    const controller = new AbortController();
                                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                                    
                                    fetch(url, { signal: controller.signal })
                                        .then(response => {
                                            clearTimeout(timeoutId);
                                            if (!response.ok) {
                                                throw new Error(`HTTP error! status: ${response.status}`);
                                            }
                                            return response.json();
                                        })
                                        .then(data => {
                                            document.querySelector(".background-info").textContent = 
                                                data.Introduction?.Background?.text || 
                                                "No background information available";
                                        })
                                        .catch(error => {
                                            console.error("Error fetching country data:", error);
                                            document.querySelector(".background-info").textContent = 
                                                "Unable to load data for " + info.name;
                                        });
                                } catch (error) {
                                    console.error("Error processing country data:", error);
                                    document.querySelector(".background-info").textContent = 
                                        "Error loading data for " + info.name;
                                }
                            }
                        }
                    })
                    .append("title")
                    .text(function(d) {
                        const info = countryInfo[d.id];
                        return info ? info.name + " (" + info.a2Code + ")" : "Country Unknown";
                    });
                
                // Clear selection when clicking on the map background or right-clicking.
                svg.on("click", function() {
                    if (!d3.event.target.classList.contains("country")) {
                        clearSelection();
                    }
                });
                svg.on("contextmenu", function() {
                    d3.event.preventDefault();
                    clearSelection();
                });
                
                // Enable zoom and pan.
                const zoom = d3.zoom()
                    .scaleExtent([0.5, 8])
                    .on("zoom", function() {
                        g.attr("transform", d3.event.transform);
                    });
                svg.call(zoom);
            } catch (error) {
                console.error("Error loading map data:", error);
            }
        }
        
        // Initialize chart tabs and load map on page load.
        initChartTabs();
        loadMapData();
    </script>
</body>
</html>
