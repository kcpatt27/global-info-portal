<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global Information Portal</title>
    <link rel="stylesheet" href="dataDisplay.css">
    <link rel="stylesheet" href="mapStyles.css">
    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="map-container">
            <svg width="960" height="500" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="info-container">
            <div class="info-header">
                <div class="flag">FLAG</div>
                <div class="country-info">COUNTRY INFO</div>
                <button class="close-sidebar" id="close-sidebar" aria-label="Close Sidebar">×</button>
            </div>
            
            <div class="sidebar-buttons">
                <button class="sidebar-button active" data-panel="info">
                    <i class="fas fa-info-circle"></i> Info
                </button>
                <button class="sidebar-button" data-panel="data">
                    <i class="fas fa-database"></i> Data
                </button>
            </div>
            
            <div class="content-panel active" id="info-panel">
                <div class="background-info">INTRODUCTION / BACKGROUND</div>
            </div>
            
            <div class="content-panel" id="data-panel">
                <div class="data-tabs">
                    <div class="data-tab active" data-tab="0">Stats</div>
                    <div class="data-tab" data-tab="1">Rankings</div>
                    <div class="data-tab" data-tab="2">Global Context</div> <!-- needs to be one word -->
                    <div class="data-tab" data-tab="3">Trends</div>
                </div>
                <div class="data-panels">
                    <div class="data-panel active" data-panel="0">Stats Data</div>
                    <div class="data-panel" data-panel="1">Rankings Data</div>
                    <div class="data-panel" data-panel="2">Global Context Data</div> <!-- needs to be one word -->
                    <div class="data-panel" data-panel="3">Trends Data</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Navigation sidebar that appears when info sidebar is collapsed -->
    <div class="nav-sidebar" id="nav-sidebar">
        <button class="nav-button" id="open-sidebar" title="Open Info Panel">
            <i class="fas fa-info-circle"></i>
        </button>
        <button class="nav-button" id="toggle-data" title="Show Data">
            <i class="fas fa-database"></i>
        </button>
        <button class="nav-button" id="toggle-search" title="Search">
            <i class="fas fa-search"></i>
        </button>
        <button class="nav-button" id="toggle-settings" title="Settings">
            <i class="fas fa-cog"></i>
        </button>
        <button class="nav-button" id="toggle-help" title="Help">
            <i class="fas fa-question-circle"></i>
        </button>
    </div>
    
    <script src="https://unpkg.com/d3@5.6.0/dist/d3.min.js"></script>
    <script src="https://unpkg.com/topojson@3.0.2/dist/topojson.min.js"></script>
    <script type="module">
        import { initDataTabs } from './events.js';
        import { updateDataPanels, clearDataPanels, showDataError } from './dataPanels.js';
        import { countryDataCache, globalDataIndex, countriesList } from './state.js';
        
        // Make functions available to the global scope
        window.initDataTabs = initDataTabs;
        window.updateDataPanels = updateDataPanels;
        window.clearDataPanels = clearDataPanels;
        window.showDataError = showDataError;
        
        // Make data structures available to the global scope
        window.countryDataCache = countryDataCache;
        window.globalDataIndex = globalDataIndex;
        window.countriesList = countriesList;
    </script>
    <script>
        const svg = d3.select("svg");
        const width = 960;
        const height = 500;

        // Toggle between content panels (info and charts)
        document.querySelectorAll('.sidebar-button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons and panels
                document.querySelectorAll('.sidebar-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
                
                // Add active class to clicked button
                this.classList.add('active');
                
                // Show corresponding panel
                const panelId = this.getAttribute('data-panel') + '-panel';
                document.getElementById(panelId).classList.add('active');
            });
        });

        // Open the sidebar if it's collapsed.
        function openSidebar() {
            document.querySelector(".info-container").classList.remove("collapsed");
            document.querySelector("#nav-sidebar").classList.remove("visible");
        }

        // Update clearSelection() to reset data contents
        function clearSelection() {
            svg.selectAll('path.country')
                .classed('selected', false)
                .transition()
                .duration(300)
                .style('fill', 'lightgreen');
            document.querySelector('.country-info').textContent = 'COUNTRY INFO';
            document.querySelector('.background-info').innerHTML = '<div class="centered-text">INTRODUCTION / BACKGROUND</div>';
            // Reset chart contents to default labels
            const charts = document.querySelectorAll('.charts .chart');
            if (charts.length >= 4) {
                charts[0].innerHTML = 'Stats Chart';
                charts[1].innerHTML = 'Rankings Chart';
                charts[2].innerHTML = 'Global Context Chart';
                charts[3].innerHTML = 'Trends Chart';
            }
            openSidebar();
        }

        // Sidebar toggle.
        document.getElementById("close-sidebar").addEventListener("click", () => {
            document.querySelector(".info-container").classList.add("collapsed");
            document.querySelector("#nav-sidebar").classList.add("visible");
        });
        
        // Open sidebar from navigation sidebar
        document.getElementById("open-sidebar").addEventListener("click", () => {
            openSidebar();
        });
        
        // Toggle charts panel from navigation sidebar
        document.getElementById("toggle-data").addEventListener("click", () => {
            openSidebar();
            // Activate charts panel
            document.querySelectorAll('.sidebar-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelector('.sidebar-button[data-panel="data"]').classList.add('active');
            document.getElementById('data-panel').classList.add('active');
        });

        // Load and render map data.
        async function loadMapData() {
            const jsonURL = "https://raw.githubusercontent.com/kcpatt27/world-atlas-2-world-factbook/main/world%20atlas%20json%2050m";
            const tsvURL = "https://raw.githubusercontent.com/kcpatt27/world-atlas-2-world-factbook/main/world%20atlas%20tsv_rows.tsv";
            try {
                // Start with just the essential data sources
                const [topoJSONdata, tsvData] = await Promise.all([
                    d3.json(jsonURL),
                    d3.tsv(tsvURL)
                ]);
                
                console.log('Loaded topoJSONdata:', topoJSONdata);
                console.log('Loaded tsvData:', tsvData);
                
                // Create country info lookup
                const countryInfo = tsvData.reduce((acc, d) => {
                    const keyOriginal = d.iso_n3; // e.g. '036'
                    const keyNumeric = String(parseInt(d.iso_n3, 10)); // e.g. '36'
                    const record = {
                        name: d.name,
                        continent: d.continent,
                        a2Code: d.iso_a2,
                        folder: d.folder
                    };
                    acc[keyOriginal] = record;
                    acc[keyNumeric] = record;
                    return acc;
                }, {});
                
                // Hardcoded special cases as fallback
                const specialFolders = {
                    "in": "south-asia", // India
                    "rs": "central-asia", // Russia
                    "ch": "east-n-southeast-asia", // China
                    "us": "north-america", // United States
                    "ca": "north-america", // Canada
                    "au": "australia-oceania", // Australia
                    "nz": "australia-oceania", // New Zealand
                    "jp": "east-n-southeast-asia", // Japan
                    "kr": "east-n-southeast-asia", // South Korea
                    "gb": "europe", // United Kingdom
                    "de": "europe", // Germany
                    "fr": "europe", // France
                    "br": "south-america", // Brazil
                    "za": "africa", // South Africa
                };
                
                // Create a group for map elements (to enable zoom/pan).
                const g = svg.append("g");
                const projection = d3.geoNaturalEarth1()
                    .scale(width / 6)
                    .translate([width / 2, height / 2]);
                const pathGenerator = d3.geoPath().projection(projection);
                
                // Draw the globe (sphere) background.
                g.append("path")
                    .attr("class", "sphere")
                    .attr("d", pathGenerator({ type: "Sphere" }));
                
                // Convert TopoJSON to GeoJSON.
                const countries = topojson.feature(topoJSONdata, topoJSONdata.objects.countries).features;
                
                // Render country shapes with transitions and events.
                g.selectAll("path.country")
                    .data(countries)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", pathGenerator)
                    .style("fill", "lightgreen")
                    .on("mouseover", function(d) {
                        if (!d3.select(this).classed("selected")) {
                            d3.select(this).transition().duration(300).style("fill", "red");
                        }
                    })
                    .on("mouseout", function(d) {
                        if (!d3.select(this).classed("selected")) {
                            d3.select(this).transition().duration(300).style("fill", "lightgreen");
                        }
                    })
                    .on("click", function(d) {
                        d3.event.stopPropagation();
                        const isSelected = d3.select(this).classed("selected");
                        if (isSelected) {
                            clearSelection();
                        } else {
                            clearSelection();
                            d3.select(this)
                                .raise()
                                .style("opacity", 0)
                                .classed("selected", true)
                                .transition()
                                .duration(300)
                                .style("opacity", 1)
                                .style("fill", "red");
                            // Ensure the sidebar is visible when a country is selected.
                            openSidebar();
                            const info = countryInfo[d.id];
                            if (info) {
                                document.querySelector(".country-info").textContent =
                                    info.name + " (" + info.a2Code + ") - " + info.continent;
                                document.querySelector(".background-info").textContent =
                                    "Loading information about " + info.name + "...";
                                
                                // Try to load additional data with error handling
                                try {
                                    // Get the correct folder using prioritized approach
                                    const a2 = info.a2Code.toLowerCase();
                                    let folder;
                                    if(info.folder) {
                                        folder = info.folder.toLowerCase().replace(/\s+/g, '-');
                                        console.log(`Using folder from TSV: ${folder} for ${a2}`);
                                    } else if(specialFolders[a2]) {
                                        folder = specialFolders[a2];
                                        console.log(`Using special case folder: ${folder} for ${a2}`);
                                    } else if(info.continent) {
                                        folder = info.continent.replace(/\s+/g, '-').toLowerCase();
                                        console.log(`Using continent-based folder: ${folder} for ${a2}`);
                                    } else {
                                        throw new Error(`Could not determine folder for ${a2}`);
                                    }
                                    
                                    const url = `https://raw.githubusercontent.com/factbook/factbook.json/master/${folder}/${a2}.json`;
                                    console.log("Fetching data from:", url);
                                    
                                    // Add a timeout to the fetch to prevent long hangs
                                    const controller = new AbortController();
                                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                                    
                                    fetch(url, { signal: controller.signal })
                                        .then(response => {
                                            clearTimeout(timeoutId);
                                            if (!response.ok) {
                                                // If the first attempt fails, try with world-factbook subfolder
                                                const altUrl = `https://raw.githubusercontent.com/factbook/factbook.json/master/factbook/${folder}/${a2}.json`;
                                                console.log("First attempt failed, trying alternative URL:", altUrl);
                                                
                                                // Create a new controller for the second request
                                                const altController = new AbortController();
                                                const altTimeoutId = setTimeout(() => altController.abort(), 10000);
                                                
                                                return fetch(altUrl, { signal: altController.signal })
                                                    .then(altResponse => {
                                                        clearTimeout(altTimeoutId);
                                                        if (!altResponse.ok) {
                                                            throw new Error(`HTTP error! status: ${altResponse.status}`);
                                                        }
                                                        return altResponse.json();
                                                    })
                                                    .catch(error => {
                                                        clearTimeout(altTimeoutId);
                                                        throw error;
                                                    });
                                            }
                                            return response.json();
                                        })
                                        .then(data => {
                                            // Remove <p> tags when displaying background info
                                            let backgroundText = data.Introduction?.Background?.text || "No background information available";
                                            backgroundText = backgroundText.replace(/<\/?p>/g, '');
                                            document.querySelector(".background-info").innerHTML = backgroundText;
                                            
                                            // Cache the country data for rankings and comparisons
                                            const countryCode = info.a2Code.toLowerCase();
                                            if (window.countryDataCache) {
                                                window.countryDataCache[countryCode] = data;
                                                console.log(`Cached data for ${info.name} (${countryCode})`);
                                            }
                                            
                                            // Update data panels with the fetched data
                                            if (typeof window.updateDataPanels === "function") {
                                                window.updateDataPanels(data);
                                            } else {
                                                console.error("updateDataPanels function not found. Make sure chart modules are properly loaded.");
                                                document.querySelectorAll('.data-panel').forEach(panel => {
                                                    panel.textContent = "Data loading error: updateDataPanels function not available";
                                                });
                                            }
                                        })
                                        .catch(error => {
                                            console.error("Error fetching country data:", error);
                                            document.querySelector(".background-info").textContent = 
                                                "Unable to load data for " + info.name;
                                        });
                                } catch (error) {
                                    console.error("Error processing country data:", error);
                                    document.querySelector(".background-info").textContent = 
                                        "Error loading data for " + info.name;
                                }
                            }
                        }
                    })
                    .append("title")
                    .text(function(d) {
                        const info = countryInfo[d.id];
                        return info ? info.name + " (" + info.a2Code + ")" : "Country Unknown";
                    });
                
                // Clear selection when clicking on the map background or right-clicking.
                svg.on("click", function() {
                    if (!d3.event.target.classList.contains("country")) {
                        clearSelection();
                    }
                });
                svg.on("contextmenu", function() {
                    d3.event.preventDefault();
                    clearSelection();
                    svg.transition()
                       .duration(640)
                       .call(zoom.transform, d3.zoomIdentity);
                });
                
                // Enable zoom and pan.
                const zoom = d3.zoom()
                    .filter(function() {
                        // Allow left (0) and middle (1) mouse buttons for zoom/pan
                        return d3.event.button === 0 || d3.event.button === 1;
                    })
                    .scaleExtent([1, 8])
                    .on("zoom", function() {
                        g.attr("transform", d3.event.transform);
                    })
                    .on("end", function() {
                        var t = d3.event.transform;
                        if (t.k < 1 || (t.k === 1 && (t.x !== 0 || t.y !== 0))) {
                            svg.transition()
                               .duration(750)
                               .call(zoom.transform, d3.zoomIdentity);
                        }
                    });
                svg.call(zoom);
                // Reset zoom on double-click
                svg.on("dblclick", function() {
                    svg.transition()
                       .duration(1000)
                       .call(zoom.transform, d3.zoomIdentity);
                });
            } catch (error) {
                console.error("Error loading map data:", error);
            }

            // Initialize data tabs if the function is defined
            if (typeof window.initDataTabs === "function") {
                window.initDataTabs();
            } else {
                console.warn("initDataTabs is not defined, skipping data tabs initialization.");
            }
        }
        
        // Load map data on page load
        loadMapData();
    </script>
</body>
</html>
